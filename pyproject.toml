[project]
name = "tualpha"
version = "1.3.0"
description = "Event-driven daily backtesting for China A-share stocks and ETFs"
readme = "README.md"
keywords = ["backtest", "quant", "a-share", "etf", "tushare"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
authors = [
    { name = "joshuaxql", email = "qiuleiustc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4",
    "filelock>=3.16",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "polars>=1.20",
    "pyarrow>=18",
    "tqdm>=4.67",
    "tushare>=1.4",
]

[project.urls]
Homepage = "https://github.com/joshuaxql/tualpha"
Repository = "https://github.com/joshuaxql/tualpha"
Documentation = "https://github.com/joshuaxql/tualpha#readme"
Issues = "https://github.com/joshuaxql/tualpha/issues"

[project.scripts]
tualpha = "tualpha.cmds.entry:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
